# Builds both Velocity Remote Windows apps (customer + technician) from this tree.
# Run it from the Actions tab ("Run workflow"), or push a tag like app-v2.0.0 to publish a release
# (the newest release is what .../releases/latest/download/<file> points at).
# The app version shown to customers comes from velocity/VERSION.
# Set these first in Settings > Secrets and variables > Actions > Variables:
#   VELOCITY_SERVER  e.g. 45.76.10.20  (your Vultr server IP or domain)
#   VELOCITY_KEY     contents of id_ed25519.pub from the server
#   VELOCITY_API     Velocity backend origin, e.g. https://my.example.com (HTTPS only)
name: Build Velocity Remote (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*", "app-v*"]

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.3"
  VELOCITY_SERVER: ${{ vars.VELOCITY_SERVER }}
  VELOCITY_KEY: ${{ vars.VELOCITY_KEY }}
  VELOCITY_API: ${{ vars.VELOCITY_API }}

permissions:
  contents: write

jobs:
  check-config:
    runs-on: ubuntu-latest
    steps:
      - name: Make sure server variables are set
        run: |
          if [ -z "$VELOCITY_SERVER" ] || [ -z "$VELOCITY_KEY" ] || [ -z "$VELOCITY_API" ]; then
            echo "::error::Set VELOCITY_SERVER, VELOCITY_KEY and VELOCITY_API under Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi
          echo "Building for server: $VELOCITY_SERVER"

  generate-bridge:
    needs: [check-config]
    uses: ./.github/workflows/bridge.yml

  build-windows:
    needs: [generate-bridge]
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - { role: customer, exe: VelocityRemoteSupport-Setup.exe, product: "Velocity Remote Support" }
          - { role: technician, exe: VelocityRemoteTechnician-Setup.exe, product: "Velocity Remote Technician" }
    env:
      VELOCITY_ROLE: ${{ matrix.role }}
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Velocity app version and file details
        shell: bash
        run: |
          v=$(tr -d '[:space:]' < velocity/VERSION)
          echo "VELOCITY_APP_VERSION=$v" >> "$GITHUB_ENV"
          # Windows file properties show Velocity, not the upstream project.
          PRODUCT="${{ matrix.product }}" python3 - <<'PY'
          import os, re
          p = 'flutter/windows/runner/Runner.rc'
          s = open(p, encoding='utf-8', errors='replace').read()
          vals = {
              'CompanyName': 'Velocity Builds And Repairs',
              'FileDescription': os.environ['PRODUCT'],
              'ProductName': os.environ['PRODUCT'],
              'LegalCopyright': 'Velocity Builds And Repairs. Based on RustDesk (AGPL-3.0).',
          }
          for k, v in vals.items():
              s = re.sub(r'(VALUE "%s", )"[^"]*"' % k, lambda m: m.group(1) + '"' + v + '"', s)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          sed -i "s/^version: .*/version: $v+${{ github.run_number }}/" flutter/pubspec.yaml
          grep -n 'CompanyName\|FileDescription\|ProductName\|LegalCopyright' flutter/windows/runner/Runner.rc
          grep -n '^version:' flutter/pubspec.yaml

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022-${{ matrix.role }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"

      - name: Build Velocity Remote (${{ matrix.role }})
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk

      - name: Copy Runner.res for version info
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -1)
          [ -n "$runner_res" ] && cp "$runner_res" ./libs/portable/Runner.res || true

      - name: Pack single-file installer
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./out
          mv ./target/release/rustdesk-portable-packer.exe ./out/${{ matrix.exe }}
          sha256sum ./out/${{ matrix.exe }}

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.role }}-windows-x64
          path: ./out/${{ matrix.exe }}
          if-no-files-found: error

      - name: Publish release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          name: Velocity Remote ${{ env.VELOCITY_APP_VERSION }}
          prerelease: false
          files: ./out/${{ matrix.exe }}
